name: Validate Human Record integrity

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate record, registry and view integrity
        run: python tools/validate_integrity.py
      - name: Test integrity rejection cases
        run: python -m unittest discover -s tools -p 'test_validate_integrity.py'
      - name: Validate mention and source-check registries
        run: python tools/validate_operational.py
      - name: Test operational registry rejection cases
        run: python -m unittest discover -s tools -p 'test_validate_operational.py'
