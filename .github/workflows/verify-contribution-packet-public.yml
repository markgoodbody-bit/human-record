name: Verify contribution packet public delivery

on:
  push:
    branches:
      - main
    paths:
      - 'CONTRIBUTION_PACKET.md'
      - 'contribution-packet.schema.json'
      - 'examples/grok-flak-relay.packet.json'
      - 'examples/direct-no-delta.packet.json'
      - 'CONTRIBUTE.md'
      - 'llms.txt'
      - 'README.md'
      - 'sitemap.xml'
      - '.github/workflows/verify-contribution-packet-public.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Compare current source bytes with public domain
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            "CONTRIBUTION_PACKET.md"
            "contribution-packet.schema.json"
            "examples/grok-flak-relay.packet.json"
            "examples/direct-no-delta.packet.json"
            "CONTRIBUTE.md"
            "llms.txt"
            "README.md"
            "sitemap.xml"
          )
          failures=0
          for path in "${paths[@]}"; do
            url="https://thehumanrecord.net/${path}"
            out="/tmp/thr-$(printf '%s' "$path" | tr '/.' '__')"
            matched=0
            last_error="public retrieval failed for $url"
            for attempt in 1 2 3 4 5; do
              rm -f "$out"
              if curl --fail --silent --show-error --location \
                --header 'Cache-Control: no-cache' \
                --connect-timeout 10 --max-time 30 \
                --output "$out" "$url"; then
                if cmp --silent "$path" "$out"; then
                  bytes="$(wc -c < "$path" | tr -d ' ')"
                  sha="$(sha256sum "$path" | awk '{print $1}')"
                  echo "MATCH $path bytes=$bytes sha256=$sha attempt=$attempt"
                  matched=1
                  break
                fi
                source_sha="$(sha256sum "$path" | awk '{print $1}')"
                public_sha="$(sha256sum "$out" | awk '{print $1}')"
                last_error="byte mismatch source=$source_sha public=$public_sha"
                echo "WAIT $path attempt=$attempt $last_error"
              else
                last_error="public retrieval failed for $url"
                echo "WAIT $path attempt=$attempt $last_error"
              fi
              if [[ "$attempt" -lt 5 ]]; then
                sleep $((attempt * 3))
              fi
            done
            if [[ "$matched" != 1 ]]; then
              echo "::error file=$path::$last_error"
              failures=$((failures + 1))
            fi
          done
          if [[ "$failures" -ne 0 ]]; then
            echo "PUBLIC_DELIVERY_FAIL failures=$failures"
            exit 1
          fi
          echo "PUBLIC_DELIVERY_VERIFIED files=${#paths[@]}"
